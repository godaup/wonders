[project]
name = "wonders"
version = "0.1.0"
description = "An implementation of a nice card game optimized for Deep Learning integration."
authors = [{ name = "Patrick Godau", email = "patrick@familiescholz.eu" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.6.2,<4.0"
classifiers = [
    'Development Status :: 2 - Pre-Alpha',
    'Intended Audience :: Developers',
    'License :: OSI Approved :: MIT License',
    'Natural Language :: English',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.6',
    'Programming Language :: Python :: 3.7',
    'Programming Language :: Python :: 3.8',
    'Programming Language :: Python :: 3.9',
]
dependencies = [
    "click==8.0.1",
]

[project.urls]
Homepage = "https://github.com/Stabmixxer/wonders"

[project.optional-dependencies]
test = [
    "pytest>=6.2.4,<7",
    "black>=21.5b2",
    "isort>=5.8.0,<6",
    "mypy>=0.900",
    "flake8>=3.9.2,<4",
    "flake8-docstrings>=1.6.0,<2",
    "pytest-cov>=2.12.0,<3",
]
dev = [
    "tox>=3.20.1,<4",
    "pre-commit>=2.12.0,<3",
    "twine>=3.3.0,<4",
    "toml>=0.10.2,<1",
    "bump2version>=1.0.1,<2",
    "build>=0.7.0",
]
doc = [
    "mkdocs>=1.1.2,<2",
    "mkdocs-include-markdown-plugin>=1.0.0,<2",
    "mkdocs-material>=6.1.7,<7",
    "mkdocstrings>=0.15.2,<0.16",
    "mkdocs-material-extensions>=1.0.1,<2",
    "mkdocs-autorefs>=0.2.1,<0.3",
]

[project.scripts]
wonders = "wonders.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["wonders*"]
exclude = ["tests*"]

[tool.black]
line-length = 120
skip-string-normalization = true
target-version = ['py36', 'py37', 'py38']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 120
skip_gitignore = true
# you can skip files as below
#skip_glob = docs/conf.py
