[project]
name = "wonders"
version = "0.1.0"
description = "A 7 Wonders-style card game engine with agents, training environments and a learned agent."
authors = [{ name = "Patrick Godau" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10,<4.0"
classifiers = [
    'Development Status :: 2 - Pre-Alpha',
    'Intended Audience :: Developers',
    'License :: OSI Approved :: MIT License',
    'Natural Language :: English',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
]
dependencies = [
    "click>=8.1,<9",
]

[project.urls]
Homepage = "https://github.com/godaup/wonders"
Issues = "https://github.com/godaup/wonders/issues"

[project.optional-dependencies]
test = [
    "pytest>=8,<9",
    "black>=24.10,<26",
    "isort>=5.13,<6",
    "mypy>=1.11,<2",
    "flake8>=7,<8",
    "flake8-docstrings>=1.7,<2",
    "pytest-cov>=5,<7",
]
dev = [
    "tox>=4.11,<5",
    "pre-commit>=3.7,<5",
    "twine>=5,<7",
    "bump2version>=1.0.1,<2",
    "build>=1.2,<2",
]
ml = [
    "torch>=2.2",
]

[project.scripts]
wonders = "wonders.cli:main"
wonders-gallery = "wonders.cli:gallery"
wonders-table = "wonders.cli:table"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["wonders*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"wonders.cards" = ["data/*.json"]
"wonders.i18n" = ["*.json"]
"wonders.ml" = ["pretrained/*.pt"]
"wonders.play" = ["static/*.html"]

[tool.black]
line-length = 120
skip-string-normalization = true
target-version = ['py310', 'py311', 'py312', 'py313']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 120
skip_gitignore = true
# you can skip files as below
#skip_glob = docs/conf.py
