<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wonders Table</title>
<style>
:root {
  --bg: #eef1f4; --panel: #ffffff; --panel-2: #f6f8fa; --ink: #1f2a37; --muted: #6b7684; --line: #dde3e9;
  --accent: #2f6fb0; --accent-ink: #ffffff; --gold: #c8951a; --red: #b23b3b; --green: #2f7d46;
  --shadow: 0 1px 2px rgba(20, 30, 45, .06), 0 4px 14px rgba(20, 30, 45, .06);
  --c-brown: #8a5a2b; --c-grey: #7c828a; --c-blue: #2f6fb0; --c-yellow: #d99a1c; --c-red: #b23b3b;
  --c-green: #3f9e5a; --c-purple: #7a4fb0; --c-white: #c8ccd2; --c-black: #2b2f36; --c-unknown: #9aa3ad;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161c; --panel: #1b2129; --panel-2: #222a33; --ink: #e6ebf1; --muted: #98a3b0; --line: #2e3742;
    --accent: #5b9be0; --accent-ink: #0d1117; --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 14px rgba(0, 0, 0, .25);
  }
}
:root[data-theme="dark"] {
  --bg: #12161c; --panel: #1b2129; --panel-2: #222a33; --ink: #e6ebf1; --muted: #98a3b0; --line: #2e3742;
  --accent: #5b9be0; --accent-ink: #0d1117; --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 14px rgba(0, 0, 0, .25);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.45 ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 12px; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
select, input[type=text], input[type=number] { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; }
h1, h2, h3 { margin: 0; }
.hidden { display: none !important; }
.muted { color: var(--muted); }

header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 16px; padding: 10px 16px;
  background: var(--panel); border-bottom: 1px solid var(--line); }
header h1 { font-size: 17px; letter-spacing: .3px; }
header .status { flex: 1; color: var(--muted); }
header .status b { color: var(--ink); }
header .status .pass { color: var(--accent); }
header .status .todo { color: var(--ink); }
header .status .hint { display: inline-grid; place-items: center; width: 18px; height: 18px; margin-left: 6px; border-radius: 50%;
  border: 1px solid var(--line); font-size: 11px; font-weight: 700; cursor: help; color: var(--muted); }
header .tools { display: flex; gap: 8px; }
#h-lang { padding: 5px 6px; }

main { max-width: 1920px; margin: 0 auto; padding: 12px 16px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 14px 16px; }
.section-title { font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }

/* menu */
#menu { max-width: 760px; margin: 24px auto; display: grid; gap: 16px; }
#menu .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.expansions { display: flex; flex-wrap: wrap; gap: 8px; }
.chip-toggle { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border: 1px solid var(--line);
  border-radius: 999px; background: var(--panel-2); }
.chip-toggle.disabled { opacity: .5; }
.seat-row { display: grid; grid-template-columns: 34px 1fr 1fr; gap: 8px; align-items: center; margin-bottom: 6px; }
.seat-row .num { color: var(--muted); font-variant-numeric: tabular-nums; }
.blurb { font-size: 12px; color: var(--muted); grid-column: 2 / 4; margin: -2px 0 4px; }
.field { display: grid; gap: 4px; }
.field label { font-size: 12px; color: var(--muted); }
.error { color: var(--red); font-weight: 600; }

/* game */
#game { display: grid; grid-template-columns: minmax(0, 1fr) 250px; gap: 12px; }
#game > * { min-width: 0; }
.opponents { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; margin-bottom: 12px; }
.opponents .city { display: grid; grid-row: span 6; grid-template-rows: subgrid; row-gap: 6px; align-content: start; }
.opponents .city > * { margin: 0; min-width: 0; }
.statgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; margin: 8px 0; }
.opponents .statgrid { margin: 0; }
.cell { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 3px 7px; min-width: 0; }
.cell .v { display: flex; align-items: center; gap: 4px; font-weight: 700; font-variant-numeric: tabular-nums; font-size: 14px; white-space: nowrap; }
.cell .v .n { margin-right: 6px; }
.cell .l { font-size: 9.5px; letter-spacing: .3px; text-transform: uppercase; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cell .glyph { font-size: 13px; color: var(--muted); }
.ic { display: inline-flex; flex: none; }
.ic svg { display: block; }
.reschip { display: inline-flex; align-items: center; gap: 2px; }
.reschip .sep { color: var(--muted); font-size: 11px; margin: 0 1px; }
.reschip .times { font-size: 11px; margin-left: 3px; }
.city { padding: 10px 12px; }
.me-side { display: grid; gap: 10px; align-content: start; }
.city.neighbour { border-color: var(--accent); }
.city-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.city-head h3 { font-size: 15px; }
.city-head > div:first-child { min-width: 0; flex: 1 1 auto; }
.city-head .score { flex: none; }
.me-side .score { display: block; text-align: right; font-size: 26px; margin-bottom: 6px; }
.score { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
.score small { font-size: 11px; font-weight: 700; color: var(--muted); margin-left: 3px; letter-spacing: .5px; }
.score .laurel { color: var(--gold); font-size: 15px; margin-right: 3px; }
.res { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0; }
.reschip { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--line); white-space: nowrap; }
.reschip.private { border-style: dashed; }
.minis { display: flex; gap: 4px; margin: 6px 0; }
.mini { flex: 1; min-width: 0; font-size: 11px; line-height: 1.3; padding: 3px 6px; border-radius: 6px; background: var(--panel-2);
  border: 1px solid var(--line); cursor: default; }
.mini.built { background: var(--green); border-color: var(--green); color: #fff; }
.wonder-link { cursor: zoom-in; text-decoration: underline dotted; }
.sub { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.agent { cursor: help; text-decoration: underline dotted; }
.mini { overflow-wrap: anywhere; hyphens: auto; }
.me-body { display: grid; grid-template-columns: minmax(230px, 300px) minmax(0, 1fr); gap: 18px; align-items: start; }
/* Too narrow for stats and city side by side (wide board, leaders in hand): stack them instead of overflowing. */
@container me-info (max-width: 480px) { .me-body { grid-template-columns: minmax(0, 1fr); gap: 10px; } }
.me-body .statgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); margin-top: 0; }
.logcard { cursor: zoom-in; text-decoration: underline dotted; text-underline-offset: 2px; }
.leaders { display: grid; grid-template-columns: repeat(3, 60px); gap: 6px; }
.leaders img { width: 60px; border-radius: 8px; box-shadow: var(--shadow); cursor: zoom-in; display: block; }
.turnbar { display: flex; gap: 10px; align-items: stretch; margin-bottom: 10px; }
.turnbar .decision { flex: 1; margin: 0; align-self: center; }
.passing { display: flex; align-items: center; gap: 10px; padding: 6px 14px; border-radius: 10px; white-space: nowrap;
  background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.passing .arrow { font-size: 26px; line-height: 1; }
.passing.right { flex-direction: row-reverse; justify-content: flex-end; }
.pay { display: flex; flex-wrap: wrap; gap: 4px; margin: -1px 0 2px; }
.pay button { font-size: 11px; padding: 2px 7px; border-radius: 999px; }
.pay button.on { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
.count { position: absolute; top: 6px; right: 6px; background: var(--ink); color: var(--bg); font-size: 12px; font-weight: 700;
  border-radius: 999px; padding: 1px 7px; }
#tip { position: fixed; z-index: 30; max-width: 280px; padding: 8px 10px; border-radius: 8px; background: var(--ink); color: var(--bg);
  font-size: 12px; line-height: 1.4; pointer-events: none; box-shadow: var(--shadow); white-space: pre-line; }
.tag { font-size: 11px; color: var(--accent); font-weight: 600; }
.stats { display: flex; flex-wrap: wrap; gap: 10px; margin: 8px 0; font-variant-numeric: tabular-nums; }
.stat { display: inline-flex; gap: 4px; align-items: center; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.tableau { display: flex; flex-wrap: wrap; gap: 4px; align-content: flex-start; align-items: flex-start; }
.cardchip { font-size: 11px; padding: 2px 7px; border-radius: 6px; color: #fff; border: 0; cursor: pointer; line-height: 1.5; }
.cardchip.white { color: #1f2a37; }
.cardchip.black { box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .22); }
.me { display: grid; grid-template-columns: fit-content(50%) minmax(320px, 1fr) auto; gap: 18px; margin-bottom: 12px; align-items: start; }
.me-info { container: me-info / inline-size; min-width: 0; }
.board img { width: auto; max-width: 100%; max-height: 270px; border-radius: 10px; display: block; cursor: zoom-in; }
.me-info .section-title { margin-top: 10px; }
.stages { display: flex; gap: 6px; margin-top: 8px; }
.stage { flex: 1; text-align: center; font-size: 12px; padding: 4px; border-radius: 6px; background: var(--panel-2); border: 1px solid var(--line); }
.stage.built { background: var(--green); color: #fff; border-color: var(--green); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.decision { padding: 10px 14px; border-radius: 10px; background: var(--panel-2); border: 1px solid var(--line); margin-bottom: 12px; }
.decision b { color: var(--accent); }
.turnbar .decision { display: flex; align-items: center; gap: 10px; }
.decision .help { flex: 1; }
#g-help { align-self: center; }
.help-toggle { flex: none; width: 26px; height: 26px; padding: 0; border-radius: 50%; font-weight: 700; line-height: 1; }
.discard { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--panel-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.discard .pile { width: 14px; height: 18px; border-radius: 3px; background: var(--c-unknown); box-shadow: 2px -2px 0 var(--line), 4px -4px 0 var(--c-unknown); margin: 4px 4px 0 0; }
.citygroups { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 10px; align-items: start; }
.cg-label { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 6px; border-left: 4px solid var(--cg); background: var(--panel-2);
  white-space: nowrap; }
.cg-label b { color: var(--muted); font-weight: 600; margin-left: 4px; }
#result th { cursor: pointer; user-select: none; white-space: nowrap; border-top: 4px solid var(--cat, transparent); }
#result th .arrow { color: var(--muted); font-size: 11px; margin-left: 3px; }
#result td.cat { background: color-mix(in srgb, var(--cat) 12%, transparent); }
.hand { display: flex; flex-wrap: wrap; gap: 10px; }
.handcard { width: 148px; display: grid; gap: 6px; align-content: start; position: relative; }
.handcard img { width: 148px; border-radius: 10px; box-shadow: var(--shadow); cursor: zoom-in; display: block; }
.handcard .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.handcard .acts > button.primary, .handcard .acts > .pay, .handcard .acts > button:only-child { grid-column: 1 / -1; }
.handcard .acts > button:not(.primary) { padding: 3px 6px; line-height: 1.25; }
.handcard .acts > button:not(.primary) small { display: block; float: none; }
.opponents .cell .l { display: none; }
.opponents .cell { padding: 3px 6px; }
.handcard .acts button { font-size: 12px; padding: 5px 6px; text-align: left; }
.handcard .acts small { color: var(--muted); float: right; }
.handcard .acts button.primary small { color: inherit; opacity: .85; }
.log { max-height: calc(100vh - 90px); overflow: auto; position: sticky; top: 62px; }
@media (max-width: 1250px) {
  .me { grid-template-columns: minmax(0, 1fr) auto; }
  .me .board { grid-column: 1 / -1; }
  .board img { max-width: 560px; }
}
.log ol { list-style: none; padding: 0; margin: 0; display: grid; gap: 2px; font-size: 13px; }
.log li.turn { margin-top: 8px; font-size: 11px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
.log li.mine { font-weight: 600; }
.busy { position: fixed; right: 16px; bottom: 16px; padding: 8px 14px; border-radius: 999px; background: var(--ink); color: var(--bg); }

/* results */
#result table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
#result th, #result td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: right; }
#result th:first-child, #result td:first-child { text-align: left; }
#result tr.winner td { font-weight: 700; }
#result tr.you td:first-child::after { content: var(--you, " (you)"); color: var(--muted); font-weight: 400; }
#result .actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
#r-analysis { margin-top: 18px; display: grid; gap: 14px; }
.an-summary { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.an-big { font-size: 26px; font-weight: 800; margin-right: 6px; }
.an-badge { font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 999px; color: #fff; background: var(--lbl); white-space: nowrap; }
.an-graph svg { width: 100%; height: auto; display: block; }
.an-moment { display: grid; grid-template-columns: auto auto minmax(0, 1fr); gap: 12px; align-items: center; padding: 10px 12px;
  border: 1px solid var(--line); border-radius: 12px; background: var(--panel-2); }
.an-moment img { width: 84px; border-radius: 8px; box-shadow: var(--shadow); cursor: zoom-in; display: block; }
.an-moment .pair { display: flex; gap: 6px; align-items: center; }
.an-moment .arrow { color: var(--muted); font-size: 18px; }
.an-moment h4 { margin: 0 0 4px; font-size: 14px; }
.an-moment p { margin: 2px 0; font-size: 13px; }
.an-table { border-collapse: collapse; width: 100%; font-size: 13px; }
.an-table td, .an-table th { padding: 4px 8px; border-bottom: 1px solid var(--line); text-align: left; }
.an-whatif { margin-top: 6px; font-size: 12px; display: grid; gap: 3px; }
.an-whatif .bar { display: grid; grid-template-columns: 70px minmax(0, 1fr) 46px; gap: 6px; align-items: center; }
.an-whatif .track { height: 8px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); overflow: hidden; }
.an-whatif .track div { height: 100%; }
.an-patterns { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; }
.an-pattern { padding: 10px 12px; border: 1px solid var(--line); border-left: 4px solid var(--pc); border-radius: 10px; background: var(--panel-2); }
.an-pattern h4 { margin: 0 0 4px; font-size: 13px; }
.an-pattern p { margin: 0; font-size: 12px; color: var(--muted); }
.an-strip { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 6px; }
.an-stat { border: 1px solid var(--line); border-top: 4px solid var(--sc, var(--line)); border-radius: 8px; padding: 6px 8px; background: var(--panel-2); }
.an-stat .k { font-size: 10px; letter-spacing: .6px; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.an-stat .v { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.2; }
.an-stat .s { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.an-rank { display: inline-block; font-size: 11px; font-weight: 700; padding: 0 6px; border-radius: 999px; margin-left: 4px; vertical-align: middle;
  background: var(--rk); color: #fff; }
.an-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.an-box { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--panel-2); }
.an-box h5 { margin: 0 0 8px; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
.an-bars { display: grid; grid-template-columns: 74px minmax(0, 1fr) 46px; gap: 4px 8px; align-items: center; font-size: 12px; }
.an-track { position: relative; height: 12px; border-radius: 4px; background: var(--panel); border: 1px solid var(--line); }
.an-track .fill { position: absolute; top: 0; bottom: 0; border-radius: 3px; }
.an-track .avg { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); opacity: .55; }
.an-track .top { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--red); opacity: .8; }
.an-track .zero { position: absolute; top: -2px; bottom: -2px; width: 1px; background: var(--muted); }
.an-grid { border-collapse: collapse; font-size: 12px; width: 100%; }
.an-grid td, .an-grid th { padding: 3px 6px; text-align: center; border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.an-grid th { color: var(--muted); font-weight: 600; }
.an-mil { font-size: 16px; font-weight: 800; }
.an-legend { display: flex; gap: 10px; font-size: 11px; color: var(--muted); margin-top: 6px; flex-wrap: wrap; }
.an-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
.an-progress { height: 8px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--line); overflow: hidden; }
.an-progress div { height: 100%; background: var(--accent); width: 0; transition: width .3s; }

/* past games, rating and achievements */
#history, #achievements { max-width: 1100px; margin: 24px auto; display: grid; gap: 16px; }
.elo-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
.elo-big { font-size: 34px; font-weight: 800; font-variant-numeric: tabular-nums; }
.elo-graph svg { width: 100%; height: auto; display: block; }
.games { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
.games th, .games td { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
.games th { font-size: 11px; letter-spacing: .6px; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.games td.num { text-align: right; }
.games tr.current td { background: color-mix(in srgb, var(--accent) 8%, transparent); }
.games .acts { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }
.games .acts button { font-size: 12px; padding: 3px 9px; }
.games .opps { color: var(--muted); font-size: 12px; }
.games .ach-mini { font-size: 15px; letter-spacing: 2px; cursor: help; }
.delta { font-weight: 700; }
.delta.up { color: var(--green); }
.delta.down { color: var(--red); }
.place { display: inline-block; min-width: 26px; padding: 0 7px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--line);
  font-weight: 700; text-align: center; }
.place.first { background: var(--gold); border-color: var(--gold); color: #fff; }
.ach-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.ach { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 12px; align-items: start; padding: 14px; border: 1px solid var(--line);
  border-radius: 14px; background: var(--panel); box-shadow: var(--shadow); }
.ach .icon { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; font-size: 28px; background: var(--panel-2);
  border: 2px solid var(--line); filter: grayscale(1); opacity: .55; }
.ach.earned .icon { filter: none; opacity: 1; }
.ach h3 { font-size: 15px; margin-bottom: 4px; }
.ach-group { font-size: 13px; letter-spacing: 1px; text-transform: uppercase; margin: 18px 0 8px; }
.ach-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.ach .tier { flex: none; font-size: 10px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; padding: 1px 8px;
  border-radius: 999px; color: #fff; background: var(--tc); cursor: help; }
.ach.tier-bronze { --tc: #a0643a; } .ach.tier-silver { --tc: #8a939d; } .ach.tier-gold { --tc: #c8951a; } .ach.tier-legendary { --tc: #7a4fb0; }
.ach.earned .icon { border-color: var(--tc); background: color-mix(in srgb, var(--tc) 16%, var(--panel)); }
.ach.tier-legendary.earned { box-shadow: 0 0 0 1px var(--tc), var(--shadow); }
.ach-progress { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 12px; margin: 2px 0 4px; }
.ach-progress .an-progress div { transition: none; }
.ach p { margin: 0 0 4px; font-size: 13px; }
.ach .when { font-size: 12px; color: var(--muted); }
.ach.earned .when { color: var(--green); font-weight: 600; }

<div id="viewer" class="hidden"><img alt=""></div>

<script>
'use strict';
const $ = (id) => document.getElementById(id);
const el = (tag, attrs = {}, ...children) => {
  const node = document.createElement(tag);

const store = {
  get(key, fallback) { try { const v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v); } catch (e) { return fallback; } },
  set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* storage unavailable */ } },

/* ---------- translations (catalog from /api/locale, keyed by the English text) ---------- */
let lang = 'en';
let L = {};
const fmtNum = (x, digits) => { const s = digits === undefined ? String(x) : Number(x).toFixed(digits); return L._decimal ? s.replace('.', L._decimal) : s; };

    const m = part.match(/^\{(\w+)\}$/);

const N = (s) => s;  // marks text translated later through a variable (so tests/test_i18n.py finds it)
const nm = (name) => L[name] || name;  // card and wonder names
const ordinal = (n) => (L._ordinal ? L._ordinal.replace('{n}', n) : n + (n === 1 ? 'st' : n === 2 ? 'nd' : n === 3 ? 'rd' : 'th'));
const withLang = (path) => path + (path.includes('?') ? '&' : '?') + 'lang=' + encodeURIComponent(lang);
function applyStatic() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach((e) => { if (e.dataset.en === undefined) e.dataset.en = e.textContent; e.textContent = t(e.dataset.en); });

    if (e.dataset[key] === undefined) e.dataset[key] = e.getAttribute(a) || '';

}
async function loadLanguage(code) {
  lang = code;
  L = code === 'en' ? {} : await (await fetch('/api/locale?lang=' + encodeURIComponent(code))).json();
  store.set('lang', code);
  applyStatic();
}

const COLORS = ['brown', 'grey', 'yellow', 'red', 'blue', 'green', 'purple', 'white', 'black'];
const AGES = ['', 'I', 'II', 'III'];
const resName = (r) => ((options.resources || {})[r] || {}).name || r;
const DECISIONS = {
  play: N('Choose a card: <b>build</b> it, use it for a <b>wonder stage</b>, or <b>discard</b> it for 3 coins. The rest of the hand passes on.'),
  last_card: N('<b>Babylon:</b> you may also play the last card of this Age.'),
  discard_build: N('<b>Build from the discard pile:</b> choose one discarded Age card and build it for free (Halicarnassus or Solomon).'),
  draft: N('<b>Leaders draft:</b> keep one leader and pass the rest.'),
  recruit: N('<b>Recruit</b> a leader for this Age, use one for a wonder stage, or discard one for 3 coins.'),
  leader_build: N('<b>Rome:</b> recruit an extra leader right away.'),
  copy_leader: N("<b>Courtesans' Guild:</b> copy one of your neighbours' leaders."),
};

let options = null;   // /api/options
let state = null;     // current game state
let menu = null;      // menu config being edited

async function api(path, body) {
  const init = body === undefined ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) };
  const res = await fetch(withLang(path), init);
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}
const assetV = () => '&v=' + ((options && options.asset_version) || '0') + '&lang=' + encodeURIComponent(lang);
const cardUrl = (name) => '/api/card.svg?name=' + encodeURIComponent(name) + assetV();
const wonderUrl = (name, side, built) => '/api/wonder.svg?name=' + encodeURIComponent(name) + '&side=' + side + '&built=' + (built || 0) + assetV();
const PAGES = ['menu', 'game', 'result', 'history', 'achievements'];
const HASHES = { history: '#games', achievements: '#achievements' };  // pages a reload or link can open
const show = (id) => {
  PAGES.forEach((s) => $(s).classList.toggle('hidden', s !== id));
  const hash = HASHES[id] || '';
  if (location.hash !== hash) window.history.replaceState(null, '', hash || location.pathname + location.search);
};
const page = () => PAGES.find((s) => !$(s).classList.contains('hidden'));
function viewUrl(src, alt, wide) {
  const img = $('viewer').querySelector('img');
  img.src = src; img.alt = alt; img.classList.toggle('wide', !!wide);
  $('viewer').classList.remove('hidden'); hideTip();
}
function viewCard(name) { viewUrl(cardUrl(name), nm(name), false); }
function viewWonder(name, side, built) { viewUrl(wonderUrl(name, side, built), nm(name), true); }
$('viewer').addEventListener('click', () => $('viewer').classList.add('hidden'));
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') $('viewer').classList.add('hidden'); });

/* ---------- tooltips: any element with data-tip ---------- */
function hideTip() { $('tip').classList.add('hidden'); }
function placeTip(e) {
  const tip = $('tip'), pad = 14;
  const x = Math.min(e.clientX + pad, window.innerWidth - tip.offsetWidth - 8);
  const y = e.clientY + pad + tip.offsetHeight > window.innerHeight ? e.clientY - tip.offsetHeight - pad : e.clientY + pad;
  tip.style.left = Math.max(8, x) + 'px'; tip.style.top = Math.max(8, y) + 'px';
}
document.addEventListener('mouseover', (e) => {
  const target = e.target.closest && e.target.closest('[data-tip]');
  if (!target) { hideTip(); return; }
  $('tip').textContent = target.dataset.tip; $('tip').classList.remove('hidden'); placeTip(e);
});
document.addEventListener('mousemove', (e) => { if (!$('tip').classList.contains('hidden')) placeTip(e); });
document.addEventListener('scroll', hideTip, true);

/* ---------- theme ---------- */
function applyTheme(theme) { if (theme) document.documentElement.dataset.theme = theme; else delete document.documentElement.dataset.theme; }
applyTheme(store.get('theme', null));
$('btn-theme').addEventListener('click', () => {
  const dark = document.documentElement.dataset.theme === 'dark' ||
    (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches);
  const next = dark ? 'light' : 'dark';
  applyTheme(next); store.set('theme', next);
});

/* ---------- menu ---------- */
function agentLabel(id) { const a = options.agents.find((x) => x.id === id); return a ? a.label : id === 'human' ? t('human') : id; }
function agentElo(id) { const a = options.agents.find((x) => x.id === id); return a ? a.elo : null; }
function agentBlurb(id) { const a = options.agents.find((x) => x.id === id); return (a && a.blurb) || t('A computer opponent.'); }
function availableWonders() {
  const ids = new Set(['base', ...menu.expansions]);
  return options.expansions.filter((e) => ids.has(e.id)).flatMap((e) => e.wonders);
}
function renderMenu() {
  const exps = $('m-expansions'); exps.replaceChildren();
  for (const e of options.expansions) {
    const fixed = e.id === 'base';
    const box = el('input', { type: 'checkbox', checked: fixed || menu.expansions.includes(e.id), disabled: fixed || !e.implemented,
      onchange: (ev) => {
        menu.expansions = ev.target.checked ? [...menu.expansions, e.id] : menu.expansions.filter((x) => x !== e.id);
        renderMenu();
      } });
    exps.append(el('label', { class: 'chip-toggle' + (e.implemented ? '' : ' disabled'), title: e.note || '' }, box, e.name,
      e.implemented ? null : el('span', { class: 'muted' }, ' ' + t('(coming)'))));
  }
  const seats = $('m-seats'); seats.replaceChildren();
  menu.seats.forEach((seat, i) => {
    const sel = el('select', { onchange: (ev) => {
      if (ev.target.value === 'human') menu.seats.forEach((s, j) => { if (j !== i && s.player === 'human') s.player = 'heuristic'; });
      else if (seat.player === 'human') { ev.target.value = 'human'; return; }  // keep exactly one human
      seat.player = ev.target.value; renderMenu();
    } }, el('option', { value: 'human', selected: seat.player === 'human' }, t('You')),
      options.agents.map((a) => el('option', { value: a.id, selected: seat.player === a.id }, a.label + ' · ' + a.elo)));
    const name = el('input', { type: 'text', value: seat.name, placeholder: seat.player === 'human' ? t('You') : agentLabel(seat.player),
      oninput: (ev) => { seat.name = ev.target.value; } });
    seats.append(el('div', { class: 'seat-row' }, el('span', { class: 'num' }, '#' + (i + 1)), sel, name));
    const agent = options.agents.find((a) => a.id === seat.player);
    const blurb = seat.player === 'human' ? t('Your seat.')
      : agent && [agent.label !== agent.id ? agent.id : '', agent.blurb, t('Elo {elo}', { elo: agent.elo })].filter(Boolean).join(' · ');
    if (blurb) seats.append(el('div', { class: 'seat-row' }, el('span'), el('div', { class: 'blurb' }, blurb)));
  });
  $('m-count').textContent = menu.seats.length;
  $('m-remove').disabled = menu.seats.length <= options.min_players;
  $('m-add').disabled = menu.seats.length >= options.max_players;
  const wonders = availableWonders();
  if (menu.wonder !== 'random' && !wonders.includes(menu.wonder)) menu.wonder = 'random';
  $('m-wonder').replaceChildren(el('option', { value: 'random' }, t('Random')),
    wonders.map((w) => el('option', { value: w, selected: menu.wonder === w }, nm(w))));
  for (const [id, key] of [['m-side', 'side'], ['m-oside', 'opponent_sides']]) {
    $(id).replaceChildren(...options.sides.map((s) => el('option', { value: s, selected: menu[key] === s }, s === 'random' ? t('Random') : t('Side {side}', { side: s }))));
  }

}
$('m-wonder').addEventListener('change', (e) => { menu.wonder = e.target.value; });
$('m-side').addEventListener('change', (e) => { menu.side = e.target.value; });
$('m-oside').addEventListener('change', (e) => { menu.opponent_sides = e.target.value; });
$('m-seed').addEventListener('input', (e) => { menu.seed = e.target.value === '' ? null : Number(e.target.value); });
$('m-add').addEventListener('click', () => { menu.seats.push({ player: 'heuristic', name: '' }); renderMenu(); });
$('m-remove').addEventListener('click', () => {
  let drop = menu.seats.length - 1;
  if (menu.seats[drop].player === 'human') drop -= 1;
  menu.seats.splice(drop, 1); renderMenu();
});
$('m-start').addEventListener('click', () => startGame(menu));
$('m-resume').addEventListener('click', render);
function openMenu() { $('m-error').textContent = ''; renderMenu(); show('menu'); setHeader(); }

async function startGame(config) {
  $('m-error').textContent = '';
  store.set('menu', config);
  setBusy(true, t('Dealing…'));
  try { state = (await api('/api/new', config)).state; render(); }
  catch (e) { $('m-error').textContent = e.message; show('menu'); }
  finally { setBusy(false); }
}

/* ---------- game ---------- */
function setBusy(on, text) { $('busy').textContent = text || t('Opponents are thinking…'); $('busy').classList.toggle('hidden', !on);
  document.querySelectorAll('.handcard button').forEach((b) => { b.disabled = on || b.dataset.locked === '1'; }); }
function playerName(seat) { return state.players[seat].name; }
function cardTip(name) {
  const info = (state.cards || {})[name] || {};
  return [nm(name), ...(info.text || [])].join('\n');
}
function chip(name) {
  const info = (state.cards || {})[name] || { color: 'unknown' };
  return el('button', { class: 'cardchip ' + info.color, style: `background:var(--c-${info.color})`, 'data-tip': cardTip(name), onclick: () => viewCard(name) }, nm(name));
}
function scoreEl(points) {
  return el('span', { class: 'score', 'data-tip': t('Victory points if the game ended now') },
    el('span', { class: 'laurel' }, '★'), String(points), el('small', {}, t('VP')));
}
function icon(key, color, size) {
  const px = size || 18;
  const span = el('span', { class: 'ic', style: `color:${color || 'currentColor'};width:${px}px;height:${px}px` });
  span.innerHTML = `<svg viewBox="0 0 24 24" width="${px}" height="${px}" aria-hidden="true">${(options.icons || {})[key] || ''}</svg>`;
  return span;
}
function resIcon(r, size) { const info = (options.resources || {})[r] || {}; return icon(info.icon, info.color, size); }
function resChips(city) {
  const counts = new Map(), sellable = new Map();
  for (const slot of city.production || []) { const k = [...slot].sort().join('|'); counts.set(k, (counts.get(k) || 0) + 1); }
  for (const slot of city.trade_production || []) { const k = [...slot].sort().join('|'); sellable.set(k, (sellable.get(k) || 0) + 1); }
  const chips = [...counts.entries()].map(([k, n]) => {
    const sold = Math.min(n, sellable.get(k) || 0);
    const rs = k.split('|');
    const names = rs.map(resName).join(' / ');
    const parts = [];
    rs.forEach((r, i) => { if (i) parts.push(el('span', { class: 'sep' }, '/')); parts.push(resIcon(r, 17)); });
    if (n > 1) parts.push(el('b', { class: 'times' }, '×' + n));
    const trade = sold === n ? t('Neighbours may buy it.') : sold === 0 ? t('For this city only: neighbours cannot buy it (yellow card or wonder stage).')
      : t('{sold} of {n} may be bought by neighbours; the rest is for this city only.', { sold, n });
    const produces = t(rs.length > 1 ? 'Produces one of {names} every turn' : 'Produces {names} every turn', { names });
    return el('span', { class: 'reschip' + (sold ? '' : ' private'), 'data-tip': produces + (n > 1 ? ' (×' + n + ')' : '') + '. ' + trade }, parts);
  });
  if (city.private_slots) chips.push(el('span', { class: 'reschip private', 'data-tip': t('Own-use production neighbours cannot buy') }, t('+{n} private', { n: city.private_slots })));
  if (!chips.length) chips.push(el('span', { class: 'muted', style: 'font-size:12px' }, t('no resources')));
  return chips;
}
function stageTip(stage) {
  return t('Stage {n}', { n: stage.index }) + (stage.built ? ' ' + t('(built)') : '') + '\n' + t('Cost: {cost}', { cost: stage.cost }) +
    (stage.effects.length ? '\n' + stage.effects.join('\n') : '');
}
function minis(board) {
  return board.stages.map((s) => el('span', { class: 'mini' + (s.built ? ' built' : ''), 'data-tip': stageTip(s) },
    (s.built ? '✓ ' : s.index + ': ') + (s.effects.join(', ') || '—')));
}
function tableau(names) {
  const color = (n) => COLORS.indexOf(((state.cards || {})[n] || {}).color);
  return [...names].sort((a, b) => color(a) - color(b) || nm(a).localeCompare(nm(b))).map(chip);

function analysisGraph(points) {
  if (!points.length) return el('p', { class: 'muted' }, t('No rated moves.'));
  const W = 900, H = 200, pad = 28;
  const ys = points.flatMap((p) => [p.played, p.best]);
  const lo = Math.min(0, ...ys), hi = Math.max(0, ...ys);
  const x = (i) => pad + (W - 2 * pad) * (points.length === 1 ? 0.5 : i / (points.length - 1));
  const y = (v) => H - pad - (H - 2 * pad) * ((v - lo) / Math.max(1e-6, hi - lo));
  const line = (key) => points.map((p, i) => `${x(i).toFixed(1)},${y(p[key]).toFixed(1)}`).join(' ');
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${t('Expected final margin after each of your moves')}">`;
  svg += `<line x1="${pad}" x2="${W - pad}" y1="${y(0)}" y2="${y(0)}" stroke="currentColor" stroke-opacity=".25" stroke-dasharray="4 4"/>`;
  points.forEach((p, i) => { if (i && p.age !== points[i - 1].age) svg += `<line x1="${x(i - 0.5)}" x2="${x(i - 0.5)}" y1="${pad / 2}" y2="${H - pad / 2}" stroke="currentColor" stroke-opacity=".15"/>`; });
  svg += `<polyline points="${line('best')}" fill="none" stroke="var(--green)" stroke-width="2" stroke-dasharray="5 4"/>`;
  svg += `<polyline points="${line('played')}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>`;
  points.forEach((p, i) => {
    const gap = p.best - p.played;
    if (gap >= 1) svg += `<circle cx="${x(i)}" cy="${y(p.played)}" r="${gap >= 5 ? 6 : gap >= 2.5 ? 5 : 4}" fill="${gap >= 5 ? 'var(--red)' : gap >= 2.5 ? '#d9771c' : '#c8951a'}"/>`;
  });
  [1, 2, 3].forEach((a) => {
    const idx = points.findIndex((p) => p.age === a);
    if (idx >= 0) svg += `<text x="${x(idx)}" y="${H - 6}" font-size="12" fill="currentColor" opacity=".6">${t('Age {age}', { age: AGES[a] })}</text>`;
  });
  svg += `<text x="${pad}" y="14" font-size="12" fill="currentColor" opacity=".6">${t('expected final margin (VP) — your moves (solid) vs the best (dashed)')}</text></svg>`;
  const box = el('div', { class: 'an-graph' }); box.innerHTML = svg; return box;
}

/* ---------- past games, rating and achievements ---------- */
const fmtDate = (iso) => { try { return new Date(iso).toLocaleString(lang, { dateStyle: window.innerWidth < 600 ? 'short' : 'medium', timeStyle: 'short' }); } catch (e) { return iso; } };
const signed = (n) => (n > 0 ? '+' : n < 0 ? '−' : '±') + Math.abs(n);
// Reference agents drawn as rungs of the ladder behind the rating graph.
const LADDER = ['random', 'blocker', 'greedy', 'heuristic', 'board', 'neural'];

function eloGraph(r) {
  const pts = [{ rating: r.start }, ...r.history];
  const ratings = pts.map((p) => p.rating);
  let lo = Math.min(...ratings) - 40, hi = Math.max(...ratings) + 40;
  const rungs = LADDER.filter((a) => a in r.agents).map((a) => ({ agent: a, elo: r.agents[a] })).sort((a, b) => a.elo - b.elo);
  const below = rungs.filter((g) => g.elo < lo).pop(), above = rungs.find((g) => g.elo > hi);
  if (below) lo = Math.min(lo, below.elo - 30);
  if (above) hi = Math.max(hi, above.elo + 30);
  const narrow = window.innerWidth < 600;  // a narrower drawing keeps the labels readable on phones
  const W = narrow ? 400 : 760, H = narrow ? 230 : 250, L = 42, R = narrow ? 86 : 96, T = 14, B = 28;
  const x = (i) => L + (pts.length > 1 ? (i / (pts.length - 1)) * (W - L - R) : (W - L - R) / 2);
  const y = (v) => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${t('Your Elo rating after each game')}">`;
  for (const g of rungs.filter((g) => g.elo >= lo && g.elo <= hi)) {
    svg += `<line x1="${L}" x2="${W - R}" y1="${y(g.elo)}" y2="${y(g.elo)}" stroke="currentColor" stroke-opacity=".22" stroke-dasharray="4 4"/>`;
    svg += `<text x="${W - R + 6}" y="${y(g.elo) + 4}" font-size="11" fill="currentColor" opacity=".6">${agentLabel(g.agent)} ${g.elo}</text>`;
  }
  const step = Math.max(50, Math.ceil((hi - lo) / 5 / 50) * 50);
  for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) {
    svg += `<text x="${L - 6}" y="${y(v) + 4}" font-size="11" text-anchor="end" fill="currentColor" opacity=".5">${v}</text>`;
  }
  svg += `<polyline points="${pts.map((p, i) => x(i) + ',' + y(p.rating)).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>`;
  pts.forEach((p, i) => {
    if (!i) return;
    const tip = `${fmtDate(p.at)}\n${t('#{place} of {n}', { place: p.place, n: p.players })} · ${t('Elo {elo}', { elo: Math.round(p.rating) })} (${signed(Math.round(p.rating - pts[i - 1].rating))})`;
    const color = p.place === 1 ? 'var(--gold)' : 'var(--accent)';
    svg += `<g data-tip="${tip.replace(/"/g, '&quot;')}"><circle cx="${x(i)}" cy="${y(p.rating)}" r="10" fill="transparent"/>`;
    svg += `<circle cx="${x(i)}" cy="${y(p.rating)}" r="${pts.length > 60 ? 2.5 : 4}" fill="${color}"/></g>`;
  });
  svg += `<text x="${L}" y="${H - 8}" font-size="11" fill="currentColor" opacity=".55">${t('start')}</text>`;
  svg += `<text x="${W - R}" y="${H - 8}" font-size="11" text-anchor="end" fill="currentColor" opacity=".55">${t(r.games === 1 ? '{n} game' : '{n} games', { n: r.games })}</text></svg>`;
  const box = el('div', { class: 'elo-graph' }); box.innerHTML = svg; return box;
}

function gameStatus(g) {
  if (g.finished && g.result) {
    const place = g.result.places[g.human];
    return el('span', {}, el('span', { class: 'place' + (place === 1 ? ' first' : '') }, String(place)), ' ' + t('of {n}', { n: g.players.length }));
  }
  const p = g.progress || {};
  if (p.decision === 'draft') return el('span', { class: 'muted' }, t('In progress: Leaders draft'));
  if (!p.age) return el('span', { class: 'muted' }, t('In progress'));
  return el('span', { class: 'muted' }, t('In progress: Age {age}, turn {n}', { age: AGES[p.age], n: p.turn + 1 }));
}

    el('p', { class: 'muted', style: 'font-size:12px;margin:8px 0 0' },
      t('Each finished game counts as a match against every opponent: finishing above them is a win, below a loss. The agents keep fixed ratings measured in thousands of games between them.')));
  if (!data.games.length) { $('h-games').replaceChildren(el('p', { class: 'muted' }, t('No games yet: start one from the menu.'))); return; }
  const head = el('tr', {}, [N('Date'), N('Result'), N('Your wonder'), N('Opponents'), N('Score'), N('Elo'), ''].map((h, k) =>
    el('th', { class: (k === 2 || k === 3 ? 'hide-narrow' : '') + (k === 4 || k === 5 ? ' num' : '') }, h ? t(h) : '')));
  const rows = data.games.map((g) => {
    const me = g.players[g.human];
    const opponents = g.players.filter((p, i) => i !== g.human).map((p) => agentLabel(p.agent) + ' ' + p.elo).join(', ');
    const delta = g.rating ? g.rating.after - g.rating.before : null;
    const ach = (g.achievements || []).map((id) => achievementInfo[id]).filter(Boolean);
    const open = async () => {
      setBusy(true, t('Loading…'));
      try { state = (await api('/api/games/open', { id: g.id })).state; render(); }
      catch (e) { alert(e.message); }
      finally { setBusy(false); }
    };
    const remove = async () => {
      if (!confirm(t('Delete this game for good?'))) return;
      try { await api('/api/games/delete', { id: g.id }); if (state && state.id === g.id) state = null; openHistory(); }
      catch (e) { alert(e.message); }
    };
    return el('tr', { class: g.current ? 'current' : '' },
      el('td', {}, fmtDate(g.finished_at || g.updated)),
      el('td', {}, gameStatus(g), ach.length ? el('span', { class: 'ach-mini', 'data-tip': ach.map((a) => a.name).join('\n') }, ' ' + ach.map((a) => a.icon).join('')) : null),
      el('td', { class: 'hide-narrow' }, me.wonder_title + ' (' + me.side + ')'),
      el('td', { class: 'hide-narrow opps' }, opponents),
      el('td', { class: 'num' }, g.result ? String(g.result.totals[g.human]) : '–'),
      el('td', { class: 'num' }, delta === null ? '–' : el('span', { class: 'delta ' + (delta > 0 ? 'up' : delta < 0 ? 'down' : ''),
        'data-tip': t('Elo {before} → {after}', { before: g.rating.before, after: g.rating.after }) }, signed(delta))),
      el('td', {}, el('div', { class: 'acts' },
        el('button', { class: g.finished ? '' : 'primary', onclick: open }, t(g.finished ? N('View') : N('Resume'))),
        el('button', { onclick: () => { window.location.href = '/api/games/record?id=' + encodeURIComponent(g.id); }, 'data-tip': t('Download record') }, '⤓'),
        el('button', { onclick: remove, 'data-tip': t('Delete') }, '✕'))));
  });
  $('h-games').replaceChildren(el('table', { class: 'games' }, el('thead', {}, head), el('tbody', {}, rows)));
}

const TIER_NAMES = { bronze: N('Bronze'), silver: N('Silver'), gold: N('Gold'), legendary: N('Legendary') };
const ACH_GROUPS = [['general', N('Feats')], ['leaders', N('Leaders')], ['cities', N('Cities')], ['opponents', N('Opponents')],
  ['career', N('Career')]];
async function openAchievements() {
  show('achievements'); setHeader();
  try {
    const data = await api('/api/achievements');
    const earned = data.achievements.filter((a) => a.count).length;
    $('a-summary').textContent = t('{earned} of {total} earned in {n} finished games', { earned, total: data.achievements.length, n: data.games })
      + ' · ' + t('{points} of {max} points', { points: data.points, max: data.max_points });
    const card = (a) => el('div', { class: 'ach tier-' + a.tier + (a.count ? ' earned' : '') },
      el('div', { class: 'icon' }, a.icon),
      el('div', {}, el('div', { class: 'ach-head' }, el('h3', {}, a.name),
        el('span', { class: 'tier', 'data-tip': t('{n} points', { n: a.points }) }, t(TIER_NAMES[a.tier]))),
        el('p', {}, a.description),
        a.goal && !a.count ? el('div', { class: 'ach-progress' }, el('div', { class: 'an-progress' },
          el('div', { style: `width:${Math.min(100, 100 * a.progress / a.goal)}%` })), el('span', {}, a.progress + ' / ' + a.goal)) : null,
        el('p', { class: 'when' }, a.count ? (a.goal ? t('Reached on {date}', { date: fmtDate(a.first) })
          : t(a.count === 1 ? 'Earned once, on {date}' : 'Earned {n} times, first on {date}', { n: a.count, date: fmtDate(a.first) }))
          : t('Not earned yet'))));
    $('a-grid').replaceChildren(...ACH_GROUPS.flatMap(([group, title]) => {
      const items = data.achievements.filter((a) => a.group === group);
      if (!items.length) return [];
      const got = items.filter((a) => a.count).length;
      return [el('h3', { class: 'ach-group' }, t(title), el('span', { class: 'muted' }, ' ' + got + ' / ' + items.length)),
        el('div', { class: 'ach-grid' }, items.map(card))];
    }));
  } catch (e) { $('a-grid').replaceChildren(el('p', { class: 'error' }, e.message)); }
}

async function renderRatingChange() {
  $('r-rating').replaceChildren();
  if (!options.saving || !state || !state.id) return;
  try {
    const [data, ach] = await Promise.all([api('/api/games'), api('/api/achievements')]);
    const g = data.games.find((x) => x.id === state.id);
    if (!g || !g.rating) return;
    const info = Object.fromEntries(ach.achievements.map((a) => [a.id, a]));
    const delta = g.rating.after - g.rating.before;
    $('r-rating').replaceChildren(
      el('span', {}, t('Your Elo: {before} → {after}', { before: g.rating.before, after: g.rating.after }), ' ',
        el('span', { class: 'delta ' + (delta > 0 ? 'up' : delta < 0 ? 'down' : '') }, '(' + signed(delta) + ')')),
      ...(g.achievements || []).map((id) => info[id]).filter(Boolean).map((a) =>
        el('span', { class: 'new-ach', 'data-tip': a.description }, a.icon + ' ' + a.name)));
  } catch (e) { /* the rating line is optional */ }
}

function renderLanguages() {
  const langs = options.languages || { en: 'English' };
  $('h-lang').replaceChildren(...Object.entries(langs).map(([code, name]) => el('option', { value: code, selected: code === lang }, name)));
  $('h-lang').classList.toggle('hidden', Object.keys(langs).length < 2);
}
$('h-lang').addEventListener('change', async (e) => {
  await loadLanguage(e.target.value);
  options = await api('/api/options');
  state = (await api('/api/state')).state;
  renderLanguages();
  const current = page();
  if (current === 'menu') openMenu(); else if (current === 'history') openHistory();
  else if (current === 'achievements') openAchievements(); else render();
  if (state && state.done) pollAnalysis();
});

(async function init() {
  const browser = (navigator.language || 'en').slice(0, 2).toLowerCase();
  await loadLanguage(new URLSearchParams(location.search).get('lang') || store.get('lang', null) || browser);
  options = await api('/api/options');
  if (!(lang in (options.languages || {}))) { await loadLanguage('en'); options = await api('/api/options'); }
  renderLanguages();
  menu = store.get('menu', null) || JSON.parse(JSON.stringify(options.defaults));
  if (!menu.seats || !menu.seats.some((s) => s.player === 'human')) menu = JSON.parse(JSON.stringify(options.defaults));
  menu.seats = menu.seats.filter((s) => s.player === 'human' || options.agents.some((a) => a.id === s.player));
  state = (await api('/api/state')).state;
  if (options.saving && location.hash === HASHES.history) openHistory();
  else if (options.saving && location.hash === HASHES.achievements) openAchievements();
  else render();
})();
</script>
</body>
</html>
