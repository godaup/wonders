# Runs the repo's pre-commit hooks (.pre-commit-config.yaml) as a CI gate, so
# whitespace/CRLF/format/lint issues are caught even if a contributor never
# installed the git hook locally.

name: pre-commit

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read
  workflow_dispatch:

jobs:
  pre-commit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: pre-commit/action@v3.0.1
