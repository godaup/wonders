# Posts the report of contributions.yml on the pull request. That workflow runs with a read-only
# token (pull requests from forks get no write access), so this one runs afterwards from the default
# branch with permission to comment. It never executes anything from the pull request: it only reads
# the uploaded Markdown, and comments only if the PR's head is the commit that produced it.

name: contributions comment

on:
  workflow_run:
    workflows: [contributions]
    types: [completed]

permissions:
  actions: read
  pull-requests: write

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        id: download
        continue-on-error: true  # no report when no contribution changed
        with:
          name: contribution-comment
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on the pull request
        if: steps.download.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          PR=$(head -c 20 pr-number)
          if ! [[ "$PR" =~ ^[0-9]+$ ]]; then echo "not a pull request number"; exit 1; fi
          HEAD=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)
          if [ "$HEAD" != "$HEAD_SHA" ]; then echo "pull request $PR is not at $HEAD_SHA; not commenting"; exit 0; fi
          head -c 60000 comment.md > body.md
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file body.md --edit-last --create-if-none \
            || gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file body.md
