[flake8]
max-line-length = 120
max-complexity = 18
# D1xx (missing-docstring) is enforced only for modules (D100); we don't mandate a
# docstring on every class/method/function, but any docstring written must be
# well-formed (D2xx/D4xx stay on). Tests are exempt from docstring checks.
ignore = E203, E266, W503, D101, D102, D103, D104, D105, D107
docstring-convention = google
per-file-ignores =
    __init__.py:F401
    tests/*:D
exclude = .git,
    __pycache__,
    setup.py,
    build,
    dist,
    docs,
    releases,
    .venv,
    .tox,
    .mypy_cache,
    .pytest_cache,
    .vscode,
    .github,
    # By default test codes will be linted.
    # tests

[mypy]
ignore_missing_imports = True

[coverage:run]
# uncomment the following to omit files during running
#omit =
[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    def main

[tox:tox]
isolated_build = true
envlist = py311, py312, py313, py314, format-check, lint, build

[gh-actions]
python =
    3.14: py314
    3.13: py313
    3.12: py312
    3.11: py311

[testenv]
allowlist_externals = pytest
extras =
    test
passenv = *
setenv =
    PYTHONPATH = {toxinidir}
    PYTHONWARNINGS = ignore
commands =
    pytest --cov=wonders --cov-branch --cov-report=xml --cov-report=term-missing tests

[testenv:format]
allowlist_externals =
    isort
    black
extras =
    test
commands =
    isort wonders plugins tests
    black wonders plugins tests

[testenv:format-check]
allowlist_externals =
    isort
    black
extras =
    test
commands =
    isort --check-only --diff wonders plugins tests
    black --check --diff wonders plugins tests

[testenv:lint]
allowlist_externals =
    flake8
    mypy
extras =
    test
commands =
    flake8 wonders plugins tests
    mypy wonders tests

[testenv:build]
allowlist_externals =
    python
    twine
extras =
    dev
commands =
    python -m build
    twine check dist/*
