<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="wonders logo">
  <title>wonders</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d3b4e"/>
      <stop offset="1" stop-color="#1b2533"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1c45a"/>
      <stop offset="1" stop-color="#c8951a"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <!-- three Ages: a stepped wonder of three tiers -->
  <rect x="30" y="80" width="68" height="14" rx="3" fill="url(#gold)"/>
  <rect x="40" y="63" width="48" height="14" rx="3" fill="url(#gold)" opacity=".9"/>
  <rect x="50" y="46" width="28" height="14" rx="3" fill="url(#gold)" opacity=".8"/>
  <!-- the seven card colours along the base -->
  <g transform="translate(26 99)">
    <rect x="0" y="0" width="10" height="6" rx="2" fill="#8a5a2b"/>
    <rect x="11" y="0" width="10" height="6" rx="2" fill="#7c828a"/>
    <rect x="22" y="0" width="10" height="6" rx="2" fill="#d99a1c"/>
    <rect x="33" y="0" width="10" height="6" rx="2" fill="#b23b3b"/>
    <rect x="44" y="0" width="10" height="6" rx="2" fill="#2f6fb0"/>
    <rect x="55" y="0" width="10" height="6" rx="2" fill="#3f9e5a"/>
    <rect x="66" y="0" width="10" height="6" rx="2" fill="#7a4fb0"/>
  </g>
  <!-- human: a laurel branch (left half of the crown) -->
  <path d="M28 56 Q 32 30 60 23" fill="none" stroke="#f1c45a" stroke-width="2.6" stroke-linecap="round"/>
  <g fill="#f1c45a">
    <ellipse cx="30" cy="45" rx="3" ry="6" transform="rotate(-25 30 45)"/>
    <ellipse cx="36" cy="35" rx="3" ry="6" transform="rotate(-45 36 35)"/>
    <ellipse cx="45" cy="27.5" rx="3" ry="6" transform="rotate(-65 45 27.5)"/>
    <ellipse cx="55" cy="23.5" rx="2.6" ry="5" transform="rotate(-80 55 23.5)"/>
  </g>
  <!-- machine: circuit traces with nodes (right half of the crown) -->
  <g fill="none" stroke="#7cc4ff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M68 23 L 82 26 L 92 34 L 98 45 L 100 56"/>
    <path d="M82 26 L 84 17"/>
    <path d="M92 34 L 101 29"/>
    <path d="M98 45 L 107 44"/>
  </g>
  <g fill="#1b2533" stroke="#7cc4ff" stroke-width="2.2">
    <circle cx="84" cy="16" r="2.8"/>
    <circle cx="102" cy="28.5" r="2.8"/>
    <circle cx="108" cy="44" r="2.8"/>
  </g>
  <g fill="#7cc4ff">
    <circle cx="82" cy="26" r="2.2"/>
    <circle cx="92" cy="34" r="2.2"/>
    <circle cx="98" cy="45" r="2.2"/>
  </g>
  <!-- the meeting point -->
  <circle cx="64" cy="22.5" r="3.4" fill="#ffffff"/>
</svg>
